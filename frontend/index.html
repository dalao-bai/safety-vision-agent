<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四口五临边隐患问答助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f0f2f5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #app {
    width: 100%;
    max-width: 760px;
    height: 100vh;
    background: #fff;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 20px rgba(0,0,0,0.08);
  }

  header {
    padding: 16px 20px;
    background: #1a56db;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  header .status {
    font-size: 12px;
    font-weight: 400;
    opacity: 0.75;
    margin-left: auto;
  }

  #download-btn {
    flex-shrink: 0;
    padding: 4px 12px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 6px;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s;
  }
  #download-btn:hover { background: rgba(255,255,255,0.25); }
  #download-btn.hidden { display: none; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 80%;
  }

  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .bubble {
    background: #1a56db;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg.assistant .bubble {
    background: #f1f3f5;
    color: #222;
    border-bottom-left-radius: 4px;
  }

  .msg .img-preview {
    max-width: 220px;
    border-radius: 10px;
    margin-bottom: 6px;
    border: 1px solid #e0e0e0;
  }

  .msg .label {
    font-size: 11px;
    color: #999;
    margin-bottom: 4px;
    padding: 0 4px;
  }

  .typing .bubble {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 12px 16px;
  }

  .dot {
    width: 7px; height: 7px;
    background: #aaa;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }

  #toolbar {
    padding: 10px 16px;
    border-top: 1px solid #eee;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  #upload-btn {
    flex-shrink: 0;
    width: 38px; height: 38px;
    background: none;
    border: 1px solid #ddd;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #555;
    transition: background 0.15s;
  }
  #upload-btn:hover { background: #f5f5f5; }

  #text-input {
    flex: 1;
    min-height: 38px;
    max-height: 120px;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    resize: none;
    outline: none;
    font-family: inherit;
    line-height: 1.5;
  }
  #text-input:focus { border-color: #1a56db; }

  #send-btn {
    flex-shrink: 0;
    width: 38px; height: 38px;
    background: #1a56db;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  #send-btn:hover { background: #1648c0; }
  #send-btn:disabled { background: #aac2f7; cursor: not-allowed; }
  #send-btn svg { width: 18px; height: 18px; fill: #fff; }

  #file-input { display: none; }

  .error-msg {
    align-self: center;
    background: #fff3f3;
    border: 1px solid #fca5a5;
    color: #b91c1c;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    max-width: 90%;
    text-align: center;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span>四口五临边隐患问答助手</span>
    <span class="status" id="status">连接中...</span>
    <a id="download-btn" class="hidden" href="#" target="_blank">下载报告</a>
  </header>
  <div id="messages"></div>
  <div id="toolbar">
    <button id="upload-btn" title="上传图片">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    </button>
    <textarea id="text-input" placeholder="输入消息，回车发送..." rows="1"></textarea>
    <button id="send-btn">
      <svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3v7l15 2-15 2v7z"/></svg>
    </button>
    <input type="file" id="file-input" accept="image/png,image/jpeg,image/jpg,image/webp,image/bmp">
  </div>
</div>

<script>
const API = 'http://localhost:8000';
let sessionId = null;
let busy = false;

const messagesEl = document.getElementById('messages');
const textInput = document.getElementById('text-input');
const sendBtn = document.getElementById('send-btn');
const uploadBtn = document.getElementById('upload-btn');
const fileInput = document.getElementById('file-input');
const statusEl = document.getElementById('status');
const downloadBtn = document.getElementById('download-btn');

function showDownloadBtn() {
  downloadBtn.href = `${API}/sessions/${sessionId}/report/download`;
  downloadBtn.classList.remove('hidden');
}

// ── helpers ──────────────────────────────────────────────

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMsg(role, content, imgSrc) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  if (imgSrc) {
    const img = document.createElement('img');
    img.className = 'img-preview';
    img.src = imgSrc;
    wrap.appendChild(img);
  }

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = role === 'user' ? '你' : '助手';
  wrap.appendChild(label);

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  wrap.appendChild(bubble);

  messagesEl.appendChild(wrap);
  scrollBottom();
  return bubble;
}

function addTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant typing';
  wrap.innerHTML = `<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  messagesEl.appendChild(wrap);
  scrollBottom();
  return wrap;
}

function addError(msg) {
  const el = document.createElement('div');
  el.className = 'error-msg';
  el.textContent = msg;
  messagesEl.appendChild(el);
  scrollBottom();
}

function setBusy(v) {
  busy = v;
  sendBtn.disabled = v;
  textInput.disabled = v;
  uploadBtn.disabled = v;
}

// ── session init ─────────────────────────────────────────

async function initSession() {
  try {
    const res = await fetch(`${API}/sessions`, { method: 'POST' });
    const data = await res.json();
    sessionId = data.session_id;
    statusEl.textContent = `会话 #${sessionId}`;
    addMsg('assistant', '您好，请上传工地现场图片，我将识别四口五临边隐患。');
  } catch (e) {
    statusEl.textContent = '连接失败';
    addError('无法连接到后端服务，请确认 http://localhost:8000 已启动。');
  }
}

// ── send text ─────────────────────────────────────────────

async function sendText() {
  const text = textInput.value.trim();
  if (!text || !sessionId || busy) return;

  textInput.value = '';
  textInput.style.height = 'auto';
  addMsg('user', text);
  setBusy(true);
  const typing = addTyping();

  try {
    const res = await fetch(`${API}/sessions/${sessionId}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    typing.remove();
    addMsg('assistant', data.reply || '（无回复）');
    // Agent 生成报告后显示下载按钮
    if (data.reply && data.reply.includes('report_path')) {
      showDownloadBtn();
    }
    // 检测回复里是否提到报告已生成
    if (data.reply && (data.reply.includes('报告') && data.reply.includes('已生成') ||
        data.reply.includes('session_') && data.reply.includes('.docx'))) {
      showDownloadBtn();
    }
  } catch (e) {
    typing.remove();
    addError('发送失败，请重试。');
  } finally {
    setBusy(false);
    textInput.focus();
  }
}

// ── upload image ──────────────────────────────────────────

async function uploadImage(file) {
  if (!sessionId || busy) return;

  const objUrl = URL.createObjectURL(file);
  addMsg('user', file.name, objUrl);
  setBusy(true);
  const typing = addTyping();

  const form = new FormData();
  form.append('file', file);

  try {
    const res = await fetch(`${API}/sessions/${sessionId}/images`, {
      method: 'POST',
      body: form,
    });
    const data = await res.json();
    typing.remove();
    if (!res.ok) {
      addError(`识别失败：${data.detail || res.statusText}`);
    } else {
      addMsg('assistant', data.assistant_message || '识别完成。');
    }
  } catch (e) {
    typing.remove();
    addError('上传失败，请重试。');
  } finally {
    setBusy(false);
    URL.revokeObjectURL(objUrl);
    textInput.focus();
  }
}

// ── events ────────────────────────────────────────────────

sendBtn.addEventListener('click', sendText);

textInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendText();
  }
});

textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
});

uploadBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) {
    uploadImage(fileInput.files[0]);
    fileInput.value = '';
  }
});

// drag-and-drop onto chat area
messagesEl.addEventListener('dragover', e => e.preventDefault());
messagesEl.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) uploadImage(file);
});

// ── start ─────────────────────────────────────────────────
initSession();
</script>
</body>
</html>
